name: GitHub Daily Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Collect GitHub candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_candidates.py

      - name: Display candidate summary
        run: |
          python - <<'PY'
          import json

          with open("output/candidates.json", encoding="utf-8") as f:
              data = json.load(f)

          print("======================================")
          print(" CANDIDATE SUMMARY")
          print("======================================")
          print(f"Total candidates: {data['candidate_count']}")
          print()

          for i, repo in enumerate(data["repositories"][:10], 1):
              print(
                  f"{i}. {repo['name']} "
                  f"⭐ {repo['stars']}"
              )
              print(f"   {repo['url']}")
              print()

          print("======================================")
          PY

      - name: Upload candidates
        uses: actions/upload-artifact@v6
        with:
          name: github-candidates
          path: output/candidates.json