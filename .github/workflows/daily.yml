name: GitHub Daily Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Collect GitHub candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_candidates.py

      - name: Save daily historical snapshot
        run: python scripts/save_history.py

      - name: Test AI connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/test_ai.py

      - name: Rank GitHub candidates with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rank_candidates.py

      - name: Analyze Top 3 repositories with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/analyze_top3.py

      - name: Generate Facebook caption with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_caption.py

      - name: Capture Repository Screenshots
        run: python scripts/take_screenshots.py

      - name: Verify Workflow Outputs
        run: |
          echo "======================================"
          echo " VERIFYING ALL WORKFLOW OUTPUTS"
          echo "======================================"

          for file in output/top3.json output/research_details.json output/facebook_caption.txt; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
          done

          if [ ! -d "output/screenshots" ] || [ -z "$(ls -A output/screenshots)" ]; then
            echo "ERROR: Screenshots directory is empty or missing."
            exit 1
          fi

          echo "All outputs & screenshots successfully verified."
          echo "======================================"

      - name: Commit research results & artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history/ output/

          if git diff --cached --quiet; then
            echo "No research changes to commit."
          else
            git commit -m "chore: save daily research, caption, and screenshots"
            git push
          fi

      - name: Upload research results & media
        uses: actions/upload-artifact@v6
        with:
          name: github-daily-research
          path: |
            output/candidates.json
            output/top3.json
            output/research_details.json
            output/facebook_caption.txt
            output/screenshots/