name: GitHub Daily Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Collect GitHub candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_candidates.py

      - name: Save daily historical snapshot
        run: python scripts/save_history.py

      - name: Test AI connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/test_ai.py

      - name: Rank GitHub candidates with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rank_candidates.py

      - name: Analyze Top 3 repositories with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/analyze_top3.py

      - name: Generate Facebook caption with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_caption.py

      - name: Capture Repository Screenshots
        run: python scripts/take_screenshots.py

      - name: Package Daily Archive
        run: python scripts/package_archive.py

      - name: Publish to Facebook Page
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: python scripts/publish_facebook.py

      - name: Commit text research & daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only commit text metadata to Git (no screenshots to prevent repo bloat)
          git add data/history/ output/top3.json output/research_details.json output/facebook_caption.txt content/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: save daily research, caption, and text archive"
            git push
          fi

      - name: Upload screenshots & outputs as temporary Artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-daily-research-media
          retention-days: 7
          path: |
            output/
