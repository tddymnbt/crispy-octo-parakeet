name: GitHub Daily Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect GitHub candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_candidates.py

      - name: Save daily historical snapshot
        run: python scripts/save_history.py

      - name: Test AI connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/test_ai.py

      - name: Rank GitHub candidates with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rank_candidates.py

      - name: Analyze Top 3 repositories with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/analyze_top3.py

      - name: Generate Facebook caption with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_caption.py

      - name: Verify AI research output
        run: |
          echo "======================================"
          echo " VERIFYING RESEARCH OUTPUT"
          echo "======================================"

          if [ ! -f output/top3.json ]; then
            echo "ERROR: output/top3.json was not created."
            exit 1
          fi

          if [ ! -f output/research_details.json ]; then
            echo "ERROR: output/research_details.json was not created."
            exit 1
          fi

          if [ ! -f output/facebook_caption.txt ]; then
            echo "ERROR: output/facebook_caption.txt was not created."
            exit 1
          fi

          echo "All research outputs & Facebook caption successfully created."
          echo
          cat output/facebook_caption.txt

          echo
          echo "======================================"

      - name: Commit research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history/ output/top3.json output/research_details.json output/facebook_caption.txt

          if git diff --cached --quiet; then
            echo "No research changes to commit."
          else
            git commit -m "chore: save daily GitHub research, analysis, and caption"
            git push
          fi

      - name: Upload research results
        uses: actions/upload-artifact@v6
        with:
          name: github-daily-research
          path: |
            output/candidates.json
            output/top3.json
            output/research_details.json
            output/facebook_caption.txt