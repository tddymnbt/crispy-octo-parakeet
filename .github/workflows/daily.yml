name: GitHub Daily Research

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Post slot to run (slot 1 prepares the daily content first)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: write

# Do not allow delayed schedule events to overlap and publish duplicates.
concurrency:
  group: facebook-page-publishing
  cancel-in-progress: false

jobs:
  prepare-and-publish-slot-1:
    if: inputs.slot == '1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Collect GitHub candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_candidates.py

      - name: Save daily historical snapshot
        run: python scripts/save_history.py

      - name: Test AI connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/test_ai.py

      - name: Rank GitHub candidates with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rank_candidates.py

      - name: Analyze Top 5 repositories with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/analyze_repos.py

      - name: Generate individual Facebook captions with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_caption.py

      - name: Capture Repository Screenshots
        run: python scripts/take_screenshots.py

      - name: Package Daily Archive
        run: python scripts/package_archive.py

      - name: Prepare Facebook media and publish slot 1
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: python scripts/publish_facebook.py --slot 1 --prepare-media

      - name: Commit daily archive and publishing state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ content/ output/candidates.json output/top5.json output/research_details.json output/captions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: prepare five daily social posts"
            git push
          fi

      - name: Upload screenshots and outputs as temporary artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-daily-research-media
          retention-days: 7
          path: output/

  publish-later-slot:
    if: inputs.slot != '1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve post slot
        id: slot
        env:
          SLOT_INPUT: ${{ inputs.slot }}
        run: |
          # Directly use the slot input from workflow_dispatch
          # (cron-job.org will always provide the slot number in inputs)
          echo "slot=$SLOT_INPUT" >> "$GITHUB_OUTPUT"

      - name: Verify Slot 1 preparation completed
        id: preflight
        run: python scripts/verify_slot_ready.py --slot ${{ steps.slot.outputs.slot }}

      - name: Publish scheduled Facebook Page post
        if: steps.preflight.outputs.ready == 'true'
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: python scripts/publish_facebook.py --slot ${{ steps.slot.outputs.slot }}

      - name: Commit publishing state
        if: steps.preflight.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ content/
          if git diff --cached --quiet; then
            echo "No publishing-state changes to commit."
          else
            git commit -m "chore: record daily social post publication"
            git push
          fi
