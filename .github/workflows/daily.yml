name: GitHub Daily Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect GitHub candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fetch_candidates.py

      - name: Save daily historical snapshot
        run: python scripts/save_history.py

      - name: Test AI connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/test_ai.py

      - name: Rank GitHub candidates with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rank_candidates.py

      - name: Display candidate summary
        run: |
          python - <<'PY'
          import json

          with open("output/candidates.json", encoding="utf-8") as f:
              data = json.load(f)

          print("======================================")
          print(" CANDIDATE SUMMARY")
          print("======================================")
          print(f"Total candidates: {data['candidate_count']}")
          print()

          for i, repo in enumerate(data["repositories"][:10], 1):
              print(
                  f"{i}. {repo['name']} "
                  f"⭐ {repo['stars']}"
              )
              print(f"   {repo['url']}")
              print()

          print("======================================")
          PY

      - name: Commit historical snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history/

          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: save daily GitHub snapshot"
            git push
          fi

      - name: Upload research results
        uses: actions/upload-artifact@v6
        with:
          name: github-daily-research
          path: |
            output/candidates.json
            output/top3.json
